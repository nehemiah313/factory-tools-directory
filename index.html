    a.className = 'card'; a.href = 'https://' + t.p + '.pages.dev/';
    a.dataset.name = (t.n + ' ' + t.d).toLowerCase();
    a.innerHTML = '<h3>' + t.n + '</h3><p>' + t.d + '</p>';
    grid.appendChild(a);
  });
  main.appendChild(sec);

});
const search = document.getElementById('search');
const noresults = document.getElementById('noresults');
search.addEventListener('input', () => {
  const q = search.value.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.cat').forEach(sec => {
    let catVisible = 0;
    sec.querySelectorAll('.card').forEach(card => {
      const show = !q || card.dataset.name.includes(q);
      card.classList.toggle('hidden', !show);
      if (show) { catVisible++; visible++; }
    });
    sec.classList.toggle('hidden', catVisible === 0);
  });
  noresults.style.display = visible === 0 ? 'block' : 'none';
});
